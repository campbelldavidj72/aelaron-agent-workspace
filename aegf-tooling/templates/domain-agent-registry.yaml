# Domain agent registry — one curator per program repository role
# Keys align with aelaron-agent-workspace repos.yaml `role` field.
version: 1

defaults:
  curator_subagent: explore
  max_envelope: E1
  context_tiers:
    L0:
      - AGENTS.md
      - governance/baseline.yaml
    L1:
      - docs/standards/agent-verification-profiles.md
    L2_source: issue_required_reading
    L3_source: enterprise_governance_baseline_yaml

domain_agents:
  governance:
    repository: aelaron-framework-governance
    verification_profile: VP-GOV-01
    context_tiers:
      L0:
        - AGENTS.md
        - GITHUB-OPERATING-MODEL.md
        - templates/agent-role-catalog.yaml
        - templates/domain-agent-registry.yaml
        - templates/governance-firing-catalog.yaml
      L1:
        - docs/standards/agent-verification-profiles.md
        - docs/agents/domain-agent-and-context-pack-model.md

  architecture:
    repository: aelaron-framework-architecture
    verification_profile: VP-ARCH-01
    context_tiers:
      L0:
        - AGENTS.md
        - MANIFEST.md
        - governance/baseline.yaml
      L1:
        - docs/standards/agent-verification-profiles.md
        - templates/architecture-overlay.yaml

  domain:
    repository: aelaron-framework-registry
    verification_profile: VP-DOM-01
    context_tiers:
      L0:
        - AGENTS.md
        - MANIFEST.md
        - governance/baseline.yaml
      L1:
        - docs/standards/agent-verification-profiles.md
        - docs/domain-requirements-index.md

  compliance:
    repository: aelaron-framework-compliance
    verification_profile: VP-CMP-01
    context_tiers:
      L0:
        - AGENTS.md
        - MANIFEST.md
        - governance/baseline.yaml
      L1:
        - docs/standards/agent-verification-profiles.md
        - obligations/
        - mappings/

  experience:
    repository: aelaron-framework-experience
    verification_profile: VP-EXP-01
    context_tiers:
      L0:
        - AGENTS.md
        - MANIFEST.md
        - governance/baseline.yaml
      L1:
        - docs/standards/agent-verification-profiles.md
        - specs/structure/

  security:
    repository: aelaron-framework-security
    verification_profile: VP-SEC-01
    context_tiers:
      L0:
        - AGENTS.md
        - MANIFEST.md
        - governance/baseline.yaml
      L1:
        - docs/standards/agent-verification-profiles.md
        - requirements/

  interface:
    repository: aelaron-framework-user-interface
    verification_profile: VP-UIF-01
    context_tiers:
      L0:
        - AGENTS.md
        - MANIFEST.md
        - governance/baseline.yaml
      L1:
        - docs/standards/agent-verification-profiles.md
        - specs/contracts/

  application:
    repository: aelaron-enterprise-application
    verification_profile: VP-ENT-01
    max_envelope: E2
    context_tiers:
      L0:
        - AGENTS.md
        - governance/baseline.yaml
        - governance/application-overlay/
      L1:
        - docs/standards/agent-verification-profiles.md
        - IMPLEMENTATION-COMMANDS.md

  registry-service:
    repository: aelaron-registry
    verification_profile: VP-AGT-01
    notes: Per-repo CI; add VP when validation script exists

  platform:
    repository: aelaron-agentic-platform
    verification_profile: VP-AGT-01

  infrastructure:
    repository: aelaron-infrastructure
    verification_profile: VP-AGT-01
    branch_policy: main
    notes: PRs target main per repo AGENTS.md

  developer-platform:
    repository: aelaron-developer-platform
    verification_profile: VP-AGT-01

  gateway:
    repository: aelaron-gateway-superstream
    verification_profile: VP-AGT-01

  analytics:
    repository: aelaron-analytics
    verification_profile: VP-AGT-01

  member-online:
    repository: aelaron-member-online
    verification_profile: VP-AGT-01

  csr-console:
    repository: aelaron-csr-console
    verification_profile: VP-AGT-01
