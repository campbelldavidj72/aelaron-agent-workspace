# Context pack — attach to issue comment or worker agent prompt
# Copy and fill per task. L2 paths must be subset of issue allowed_paths.
version: 1

context_pack:
  issue: null  # e.g. 95
  target_repository: null  # e.g. aelaron-framework-registry
  domain_agent_role: null  # e.g. domain — key in templates/domain-agent-registry.yaml
  worker_agent_role: null  # e.g. engineer

  framework_pins:
    aegf: null
    aapf: null
    # extend per governance/baseline.yaml

  tiers:
    L0:
      - path: AGENTS.md
        purpose: repository agent contract
    L1:
      - path: docs/standards/agent-verification-profiles.md
        purpose: verification profile definitions
    L2:
      # - path: specs/commands/example.md
      #   purpose: task-specific rules

  excluded:
    - path: null
      reason: null  # e.g. outside allowed paths

  produced_by: domain-agent
  produced_at: null  # ISO-8601

  validation:
    status: null  # ok | incomplete | stale
    framework_pins:
      aegf: null
    log_command: >-
      python3 aelaron-framework-governance/.github/scripts/agent-log.py validate-context
      --domain-agent-role <role> --target-repository <repo> --clear-active
