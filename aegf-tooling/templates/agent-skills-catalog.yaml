# Agent skills catalog — maps domain/worker roles to Cursor project and plugin skills
# Project skills: aelaron-agent-workspace/.cursor/skills/<name>/SKILL.md
# Plugin skills: user/plugin scoped; listed here for spawn briefs and subagent injection
version: 1

global_project_skills:
  - aegf-context-pack
  - aegf-issue-contract
  - aegf-governance-run-report
  - aegf-agent-log

parent_agent:
  allowed_project_skills:
    - aegf-context-pack
    - aegf-issue-contract
    - aegf-governance-run-report
    - aegf-verification-profile
  allowed_plugin_skills:
    - babysit
    - split-to-prs
    - create-rule
    - create-hook
  forbidden_plugin_skills:
    - update-cursor-settings
    - statusline

domain_agent_policy:
  curator_subagent: explore
  allowed_project_skills:
    - aegf-context-pack
    - aegf-issue-contract
    - aegf-agent-log
  allowed_plugin_skills:
    - canvas
  forbidden_plugin_skills:
    - babysit
    - split-to-prs
    - figma-use
    - ddsetup
    - deploy-model

worker_agents:
  program-manager:
    cursor_subagent: program-manager
    allowed_project_skills:
      - aegf-governance-run-report
      - aegf-issue-contract
    allowed_plugin_skills: []

  product-manager:
    cursor_subagent: product-manager
    allowed_project_skills:
      - aegf-issue-contract
    allowed_plugin_skills:
      - canvas

  enterprise-architect:
    cursor_subagent: enterprise-architect
    allowed_project_skills:
      - aegf-issue-contract
      - aegf-verification-profile
    allowed_plugin_skills:
      - canvas
      - figma-generate-diagram

  engineer:
    cursor_subagent: engineer
    requires_domain_pack: true
    allowed_project_skills:
      - aegf-governance-run-report
      - aegf-verification-profile
      - aegf-issue-contract
      - aegf-agent-log
    allowed_plugin_skills:
      - babysit
      - split-to-prs

  quality-engineer:
    cursor_subagent: quality-engineer
    allowed_project_skills:
      - aegf-governance-run-report
      - aegf-verification-profile
    allowed_plugin_skills:
      - babysit

  ux-designer:
    cursor_subagent: ux-designer
    allowed_project_skills:
      - aegf-issue-contract
    allowed_plugin_skills:
      - figma-use
      - figma-generate-design
      - figma-generate-library
      - canvas

  compliance-manager:
    cursor_subagent: explore
    domain_agent_role: compliance
    allowed_project_skills:
      - aegf-context-pack
      - aegf-issue-contract
    allowed_plugin_skills:
      - canvas

  risk-manager-line1:
    cursor_subagent: risk-manager-line1
    allowed_project_skills:
      - aegf-issue-contract
    allowed_plugin_skills:
      - canvas

  infosec-specialist:
    cursor_subagent: infosec-specialist
    allowed_project_skills:
      - aegf-issue-contract
      - aegf-verification-profile
    allowed_plugin_skills:
      - ddsetup
      - ddtoolsets

  platform-manager:
    cursor_subagent: platform-manager
    allowed_project_skills:
      - aegf-governance-run-report
    allowed_plugin_skills:
      - ddsetup
      - ddconfig
      - ddtoolsets

  ci-investigator:
    cursor_subagent: ci-investigator
    allowed_project_skills:
      - aegf-verification-profile
    allowed_plugin_skills:
      - babysit
      - ddsetup

# Subagent hook resolution — cursor_subagent_type → skills injected by preToolUse
subagent_skills:
  explore:
    merge: domain_agent_policy
    notes: Domain curator default; compliance-manager shares explore — parent must set worker_agent_role in prompt

  engineer:
    merge: worker_agents.engineer

  quality-engineer:
    merge: worker_agents.quality-engineer

  enterprise-architect:
    merge: worker_agents.enterprise-architect

  product-manager:
    merge: worker_agents.product-manager

  program-manager:
    merge: worker_agents.program-manager

  ux-designer:
    merge: worker_agents.ux-designer

  risk-manager-line1:
    merge: worker_agents.risk-manager-line1

  infosec-specialist:
    merge: worker_agents.infosec-specialist

  platform-manager:
    merge: worker_agents.platform-manager

  ci-investigator:
    merge: worker_agents.ci-investigator

  generalPurpose:
    allowed_project_skills:
      - aegf-governance-run-report
      - aegf-issue-contract
    forbidden_plugin_skills:
      - update-cursor-settings

  shell:
    allowed_project_skills:
      - aegf-governance-run-report
