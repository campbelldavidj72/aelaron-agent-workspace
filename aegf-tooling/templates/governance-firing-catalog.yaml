# Governance firing catalog — operational checkpoints derived from AEGF
# Coverage = fired / applicable for run-type (not all governance docs).
version: 1

run_types:
  standard:
    groups: [intake, execution, context, verification, branch]
  material:
    groups: [intake, execution, context, verification, branch, material]
  release:
    groups: [intake, execution, context, verification, branch, release]

groups:
  intake:
    label: Work intake
    elements:
      - id: INT-001
        name: Linked GitHub issue
        detect: attested
      - id: INT-002
        name: Issue was status/ready before implementation
        detect: attested
      - id: INT-003
        name: Risk tier declared on issue
        detect: attested
      - id: INT-004
        name: Scope envelope declared on issue
        detect: attested
      - id: INT-005
        name: Allowed paths declared on issue
        detect: attested
      - id: INT-006
        name: Acceptance criteria declared on issue
        detect: attested
      - id: INT-007
        name: Issue on program project board
        detect: attested

  execution:
    label: Agent execution
    elements:
      - id: EXE-001
        name: Work stayed within allowed paths
        detect: attested
      - id: EXE-002
        name: Work stayed within scope envelope
        detect: attested
      - id: EXE-003
        name: Declared verification profile executed
        detect: attested
      - id: EXE-004
        name: PR targets development (not main) for agent merge
        detect: attested
      - id: EXE-005
        name: Program development phase merge rules respected
        detect: attested
      - id: EXE-006
        name: Program project Status reconciled with issue state
        detect: attested

  context:
    label: Context management
    elements:
      - id: CTX-001
        name: Context pack declared on issue (target repo and L0 paths)
        detect: attested
      - id: CTX-002
        name: Context used list in PR body or run report
        detect: attested
      - id: CTX-003
        name: Domain agent context pack before E2+ worker implementation
        detect: attested

  verification:
    label: Verification profiles
    elements:
      - id: VER-GOV-01
        name: VP-GOV-01 governance-check.sh pass
        detect: ci
        ci_context: governance-check
      - id: VER-AGT-01
        name: VP-AGT-01 issue contract complete in PR
        detect: attested
      - id: VER-TST-01
        name: VP-TST-01 automated test suite pass
        detect: attested
      - id: VER-PROG-01
        name: VP-PROG-01 program board sync pass
        detect: attested
      - id: VER-REL-01
        name: VP-REL-01 release evidence present
        detect: attested
        run_types: [release]

  branch:
    label: Branch policy
    elements:
      - id: BRN-001
        name: Agent did not merge to main
        detect: attested
      - id: BRN-002
        name: Human promotion to main identified when releasing
        detect: attested
        run_types: [release]

  material:
    label: Material change workflow
    elements:
      - id: MAT-001
        name: Phase 1 analysis comment on issue
        detect: attested
      - id: MAT-002
        name: Phase 2 security review or waiver on issue
        detect: attested
      - id: MAT-003
        name: Verification evidence block in PR body
        detect: attested

  release:
    label: Release governance
    elements:
      - id: REL-001
        name: VERSION semver valid
        detect: attested
      - id: REL-002
        name: Release notes file present
        detect: attested
      - id: REL-003
        name: Promotion PR human merge (not agent)
        detect: attested

controls_map:
  # Optional cross-reference to control-register.yaml
  INT-001: ENG-ISS-001
  EXE-002: AI-AGT-002
  EXE-003: AI-AGT-003
  VER-GOV-01: AI-AGT-003
  VER-TST-01: ENG-TST-001
