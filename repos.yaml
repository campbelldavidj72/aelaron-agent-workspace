# Aelaron agent workspace — sibling repository manifest
# Single source of truth for setup-v4-repos.sh
#
# L0: this workspace (hooks + aegf-tooling/)
# L1: aelaron-platform-specifications
# L2: application repos

organization: campbelldavidj72
default_branch: development

repositories:
  - path: aelaron-platform-specifications
    role: specifications
    clone_submodules: false
    verification_profile: VP-SPEC-01
    validation: .github/scripts/specifications-check.sh

  - path: aelaron-framework-governance
    role: governance-source
    clone_submodules: false
    verification_profile: VP-GOV-01
    validation: .github/scripts/governance-check.sh
    note: Source for aegf-tooling sync; policy specs in L1 modules/governance/

  - path: aelaron-enterprise-application
    role: application
    clone_submodules: true
    verification_profile: VP-ENT-01
    validation: .github/scripts/enterprise-application-validation.sh

  - path: aelaron-gateway-superstream
    role: gateway
    clone_submodules: false

  - path: aelaron-infrastructure
    role: infrastructure
    clone_submodules: false

  # Legacy L2 framework repos (superseded by aelaron-platform-specifications v2.0.0)
  - path: aelaron-framework-architecture
    role: legacy-framework
    clone_submodules: false
    validation: .github/scripts/architecture-validation.sh

  - path: aelaron-framework-registry
    role: legacy-framework
    clone_submodules: false
    validation: .github/scripts/domain-validation.sh

  - path: aelaron-framework-compliance
    role: legacy-framework
    clone_submodules: false
    validation: .github/scripts/compliance-validation.sh

  - path: aelaron-framework-experience
    role: legacy-framework
    clone_submodules: false
    validation: .github/scripts/experience-validation.sh

  - path: aelaron-framework-security
    role: legacy-framework
    clone_submodules: false
    validation: .github/scripts/security-validation.sh

  - path: aelaron-framework-user-interface
    role: legacy-framework
    clone_submodules: false
    validation: .github/scripts/user-interface-validation.sh

  # Reserved L2 apps (clone when implemented)
  - path: aelaron-registry
    role: registry-service
    clone_submodules: false

  - path: aelaron-agentic-platform
    role: platform
    clone_submodules: false

  - path: aelaron-developer-platform
    role: developer-platform
    clone_submodules: false

  - path: aelaron-analytics
    role: analytics
    clone_submodules: false

  - path: aelaron-member-online
    role: member-online
    clone_submodules: false

  - path: aelaron-csr-console
    role: csr-console
    clone_submodules: false
