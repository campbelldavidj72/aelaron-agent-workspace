# Aelaron agent workspace — sibling repository manifest
# Single source of truth for setup-v4-repos.sh
#
# L0: this workspace (hooks + aegf-tooling/)
# L1: aelaron-platform-specifications
# L2: application repos

organization: campbelldavidj72
default_branch: development

repositories:
  - path: aelaron-platform-specifications
    role: specifications
    clone_submodules: false
    verification_profile: VP-SPEC-01
    validation: .github/scripts/specifications-check.sh

  - path: aelaron-framework-governance
    role: governance-source
    clone_submodules: false
    verification_profile: VP-GOV-01
    validation: .github/scripts/governance-check.sh
    note: Source for aegf-tooling sync; policy specs live in L1 modules/governance/

  - path: aelaron-enterprise-application
    role: application
    clone_submodules: false
    verification_profile: VP-ENT-01
    validation: .github/scripts/enterprise-application-validation.sh

  - path: aelaron-gateway-superstream
    role: gateway
    clone_submodules: false

  - path: aelaron-infrastructure
    role: infrastructure
    clone_submodules: false
    note: No development branch yet; stays on repo default branch after clone

# Reserved L2 apps (not cloned by setup-v4-repos.sh until implemented):
#   aelaron-registry, aelaron-agentic-platform, aelaron-developer-platform,
#   aelaron-analytics, aelaron-member-online, aelaron-csr-console
#
# Superseded by L1 aelaron-platform-specifications @ v2.0.0 (do not clone locally):
#   aelaron-framework-architecture, aelaron-framework-registry,
#   aelaron-framework-compliance, aelaron-framework-experience,
#   aelaron-framework-security, aelaron-framework-user-interface
